name: elephant_tracking_app # Project name changed here
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core for general Firebase services
  firebase_core: ^3.0.0
  # Firebase Authentication for user login/registration
  firebase_auth: ^5.0.0
  # Firebase Realtime Database for elephant location data
  firebase_database: ^11.0.0
  # Flutter Map for displaying maps (replaces google_maps_flutter)
  flutter_map: ^6.0.0 # Added flutter_map
  # Geolocator for getting device's current location
  geolocator: ^12.0.0
  # LatLong for distance calculations (used by flutter_map as well)
  latlong2: ^0.9.0
  # Provider for state management (a common choice for MVC-like structures in Flutter)
  provider: ^6.1.2
  # For displaying loading indicators
  flutter_spinkit: ^5.2.1
  # For displaying SVG assets (your logo)
  flutter_svg: ^2.0.10+1
  # Audio players for sound alerts (NEW)
  audioplayers: ^6.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png # Make sure you have your logo in this path
    - assets/audio/elephant_alert.mp3 # NEW: Add your alert sound file here

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600